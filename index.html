<style>

pace-between;align-items:center;margin-top:12px;font-size:11px;color:#64736a}.pet-meter-row strong{font-size:11px;color:#50665a}.pet-progress{margin-top:6px}.hunger-fill{transition:width .4s,background .3s}.pet-actions{margin-top:10px}.pet-actions button:disabled{opacity:.55;cursor:not-allowed}.pet-inventory{font-size:9px;color:#929c95;margin-top:9px;line-height:1.4}@keyframes petWalk{0%{transform:translate(-26px,2px) rotate(-4deg)}20%{transform:translate(-18px,-4px) rotate(4deg)}45%{transform:translate(0,1px) rotate(-3deg)}70%{transform:translate(20px,-4px) rotate(4deg)}100%{transform:translate(26px,2px) rotate(-4deg)}}@keyframes furnPop{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes speechPop{from{opacity:.2;translate:-50% 5px}to{opacity:1;translate:-50% 0}}.pet-card{background:#fff;border:1px solid #edf0ed;border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-top:15px}.pet-head{display:flex;justify-content:space-between;align-items:flex-start}.pet-head h2{font-size:16px;margin:3px 0}.pet-subtitle{font-size:11px;color:var(--muted);margin:4px 0 12px}.coin-pill{background:#fff4dc;color:#996c29;border-radius:20px;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}.pet-stage{height:150px;border-radius:15px;background:linear-gradient(160deg,#f4ead7,#f1dfc9 55%,#e4d1b6);position:relative;overflow:hidden;display:grid;place-items:center}.pet-stage:before{content:"";position:absolute;left:-8%;right:-8%;bottom:-35px;height:80px;background:#b9c999;border-radius:50%}.pet-emoji{position:relative;z-index:1;font-size:72px;filter:drop-shadow(0 7px 6px #60492c35);animation:petBob 2s ease-in-out infinite}.pet-name{position:absolute;top:10px;left:12px;z-index:2;font-size:11px;font-weight:700;color:#705c43}.pet-happy{position:absolute;top:10px;right:12px;z-index:2;background:#ffffffb8;border-radius:20px;padding:5px 8px;color:#8c7153;font-size:10px}.pet-photo{width:82px;height:82px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 16px #59493330}.pet-photo-wrap{position:relative;z-index:1}.pet-heart{position:absolute;right:-5px;top:-2px;font-size:21px;animation:heart 1.3s ease-in-out infinite}.pet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pet-actions button,.pet-edit{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 7px;font-size:11px;color:#536259;font-weight:650}.pet-actions button:hover,.pet-edit:hover{background:#f6faf7}.pet-progress{height:6px;background:#edf1ed;border-radius:10px;overflow:hidden;margin-top:12px}.pet-progress span{display:block;height:100%;background:#88b89a;border-radius:10px;transition:width .3s}.pet-progress-label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px}.pet-edit{width:100%;margin-top:10px;color:var(--green)}.pet-shop{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.pet-shop-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.shop-tabs{display:flex;gap:5px;margin:9px 0}.shop-tab{border:0;background:#f3f5f3;color:#728078;border-radius:7px;padding:6px 9px;font-size:10px}.shop-tab.active{background:#e9f4ee;color:var(--green);font-weight:700}.shop-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.shop-item{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;gap:7px;min-width:0}.shop-item span:first-child{font-size:20px}.shop-item-info{min-width:0;flex:1}.shop-item-info strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shop-item-info small{font-size:9px;color:var(--muted)}.shop-item button{border:0;background:#edf5ef;color:var(--green);border-radius:7px;padding:6px 7px;font-size:9px;font-weight:700}.shop-item button:disabled{background:#f0f1f0;color:#a5aca7}.pet-empty{font-size:11px;color:var(--muted);line-height:1.6}.pet-toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#253b31;color:white;padding:10px 14px;border-radius:10px;font-size:12px;z-index:30;pointer-events:none}.pet-toast.show{opacity:1;transform:translate(-50%,0)}@keyframes petBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes heart{50%{transform:scale(1.2)}}.week-card{background:#edf4ef;border-radius:13px;padding:13px 14px;margin-top:15px;display:flex;align-items:center;justify-content:space-between}.week-card strong{font-size:12px}.week-card p{margin:4px 0 0;font-size:11px;color:#7e8c83}.week-card button{border:0;background:transparent;color:var(--green);font-size:11px;font-weight:650;padding:5px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#203b31;color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
/* modal */.overlay{position:fixed;inset:0;background:#16251f66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.open{display:flex}.modal{width:min(100%,460px);background:#fff;border-radius:19px;padding:24px;box-shadow:0 22px 60px #10251a30}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal-head h2{font-size:19px;margin:0}.close-btn{border:0;background:#f2f5f3;border-radius:9px;width:32px;height:32px;color:#637168;font-size:18px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:650;color:#6f7c74;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #e3e9e4;border-radius:9px;padding:10px 11px;outline:none;color:var(--ink);background:white}.field input:focus,.field textarea:focus,.field select:focus{border-color:#91b6a0;box-shadow:0 0 0 3px #eaf4ed}.field textarea{resize:vertical;min-height:76px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pet-choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pet-choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;display:grid;justify-items:center;gap:5px;color:var(--ink)}.pet-choice span{font-size:29px}.pet-choice small{font-size:10px}.pet-choice.active{background:#eef6f0;border-color:#9cc4aa;box-shadow:0 0 0 2px #e6f2e9}.photo-preview{margin-top:9px}.photo-preview img{width:66px;height:66px;border-radius:12px;object-fit:cover}.photo-hint{font-size:10px;color:var(--muted)}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:21px}.delete-btn{border:0;background:transparent;color:#b06a62;font-size:12px}.save-btn{border:0;background:var(--green);color:white;border-radius:9px;padding:10px 18px;font-weight:650}.cancel-btn{border:1px solid var(--line);background:white;color:#627168;border-radius:9px;padding:9px 15px;margin-right:7px}

.auth-gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#eef5ef 0%,#f6f7f5 56%,#edf1ec 100%)}.auth-card{width:min(100%,420px);padding:38px 34px;background:#fff;border:1px solid #edf0ed;border-radius:24px;box-shadow:0 24px 70px #25382e14;text-align:center}.auth-logo{width:52px;height:52px;margin:0 auto 20px;border-radius:17px;background:var(--green);color:white;display:grid;place-items:center;font-size:24px}.auth-card h1{font-size:24px;margin:0 0 9px}.auth-copy{margin:0 0 24px;color:#78857d;font-size:13px;line-height:1.7}.google-signin{display:flex;justify-content:center;align-items:center;gap:11px;width:100%;min-height:48px;border:1px solid #dfe5e1;border-radius:12px;background:#fff;color:#34433b;font-weight:650;transition:background .15s,border-color .15s}.google-signin:hover{background:#f8faf8;border-color:#cbd7ce}.google-signin:disabled{opacity:.65;cursor:wait}.google-mark{font-size:18px;font-weight:800;color:#4285f4}.auth-error{min-height:20px;margin:14px 0 0;color:#b44d3e;font-size:12px;line-height:1.6}.top-user{display:flex;align-items:center;gap:9px}.user-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e6eee8}.user-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#65736b;font-size:12px}.signout-btn{border:1px solid var(--line);background:white;color:#526158;border-radius:9px;padding:8px 10px;font-size:11px}.signout-btn:hover{background:#f7faf8}.app[hidden],.top-user[hidden],.auth-gate[hidden]{display:none!important}@media(max-width:560px){.auth-card{padding:30px 23px}.user-name{display:none}.signout-btn{padding:7px 8px}}

</head>
<body>
<div id="authGate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <section class="auth-card">
    <div class="auth-logo" aria-hidden="true">日</div>
    <h1 id="authTitle">登入日序</h1>
    <p class="auth-copy">請使用 Google 帳號登入，開始查看與管理你的每日行程。</p>
    <button id="googleSignIn" class="google-signin" type="button" disabled><span class="google-mark" aria-hidden="true">G</span><span>正在連線 Firebase…</span></button>
    <p id="authError" class="auth-error" role="status" aria-live="polite"></p>
  </section>
</div>

<div class="app">
<header class="topbar"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2m4 0h2m-8 4h2"/></svg></div><span>日序</span></div><div class="topright"><span class="today-pill" id="topToday"></span><div class="top-user" id="topUser" hidden><img class="user-photo" id="userPhoto" alt="" hidden><span class="user-name" id="userName"></span><button class="signout-btn" id="googleSignOut" type="button">登出</button></div></div></header>
<main class="layout"><section class="calendar-card"><div class="cal-head"><div><div class="eyebrow">MONTHLY OVERVIEW</div><h1 id="monthTitle"></h1></div><div class="month-actions"><button class="today-btn" id="todayBtn">今天</button><button id="prevBtn" aria-label="上個月">‹</button><button id="nextBtn" aria-label="下個月">›</button></div></div><div class="cal-grid" id="calendar"></div><div class="cal-foot"><div class="legend"><i class="dot"></i>行程</div><div class="legend"><i class="dot task"></i>任務</div><div class="legend"><i class="dot purple"></i>個人</div></div></section>

function showAuthError(message) { authError.textContent = message; }
function setSignedIn(user) {
  const signedIn = Boolean(user);
  authGate.hidden = signedIn;
  appContent.hidden = !signedIn;
  appContent.inert = !signedIn;
  topUser.hidden = !signedIn;
  showAuthError('');
  signOutButton.disabled = false;

  } else {
    userName.textContent = '';
    userPhoto.removeAttribute('src');
  }
}
try {
  if (Object.values(firebaseConfig).some(value => value.startsWith('YOUR_'))) {
    throw new Error('尚未設定 Firebase Web App 設定，請先填入 firebaseConfig。');
  }

  const auth = getAuth(firebaseApp);
  const provider = new GoogleAuthProvider();

        'auth/unauthorized-domain': '此網域尚未加入 Firebase Authentication 的 Authorized domains。',
        'auth/operation-not-allowed': 'Firebase 尚未啟用 Google 登入提供者。',

}

function getPetMessage(){if(petData.dead)return `嗚…${petData.name}餓得沒力氣了，餵牠一份食物吧。`;if(petData.fullness<20)return `主人，我的肚子咕嚕咕嚕…可以餵我嗎？`;if(petData.fullness<45)return `有點餓了，想吃點好吃的！`;if(petData.bond>0)return ['謝謝你陪我，我最喜歡你了！','今天也一起加油吧！','我在這裡等你回來喔。'][petData.bond%3];return `嗨，${petData.name}在這裡陪你。完成任務也別忘了照顧自己！`}
function petFurnitureIcons(){return petData.furniture.map(id=>SHOP.find(x=>x.id===id)).filter(Boolean).map((x,i)=>{const p=petData.furniturePos?.[x.id]||{x:18+(i*27)%68,y:78-(i%2)*18};return `<button class="placed-furniture" style="left:${p.x}%;top:${p.y}%" data-x="${p.x}" data-y="${p.y}" data-remove-furniture="${x.id}" title="拖曳移動；點擊收起${x.name}" aria-label="移動或收起${x.name}">${x.icon}</button>`}).join('')}function renderPet(){clearTimeout(startPetWander.timer);const root=$('petRoot');if(!petData){root.innerHTML='<div class="pet-head"><div><div class="eyebrow">LITTLE COMPANION</div><h2>領養一位小夥伴</h2></div><span class="coin-pill">🪙 0</span></div><p class="pet-subtitle">完成任務賺取代幣，為牠準備喜歡的食物與家具。</p><div class="pet-stage"><span class="pet-emoji">🐾</span></div><button class="pet-edit" id="adoptPet">選擇我的寵物</button><div class="pet-shop"><div class="pet-shop-head">寵物小舖 <span style="color:#a5aca7;font-size:10px">領養後開放</span></div><p class="pet-empty">每完成一項任務可獲得 5 枚代幣。</p></div>';$('adoptPet').addEventListener('click',()=>openPetSetup());return}updatePetState();const kinds={cat:'🐱',dog:'🐶',chick:'🐥'};const mood=petData.dead?'需要食物':petData.fullness<25?'肚子餓了':petData.fullness<55?'有點餓':'精神飽滿';const pos=petData.petPos||{x:50,y:62};const stage=petData.photo?`<div class="pet-photo-wrap pet-walker" style="--pet-x:${pos.x}%;--pet-y:${pos.y}%"><img class="pet-photo" src="${petData.photo}" alt="${escapeHtml(petData.name)}"><span class="pet-heart">${petData.dead?'💤':'💛'}</span></div>`:`<span class="pet-emoji pet-walker" style="--pet-x:${pos.x}%;--pet-y:${pos.y}%">${kinds[petData.kind]||kinds.cat}</span>`;const visibleFoods=SHOP.filter(x=>x.type==='food'&&!petData.inventory.includes(x.id));root.innerHTML=`<div class="pet-head"><div><div class="eyebrow">LITTLE COMPANION</div><h2>${escapeHtml(petData.name)}</h2></div><span class="coin-pill">🪙 ${petData.coins}</span></div><p class="pet-subtitle">${petData.dead?'需要你的照顧':'陪伴你的日常小夥伴'}</p><div id="petStage" class="pet-stage room-${petData.background||'home'} ${petData.dead?'pet-dead':''}"><span class="pet-name">${escapeHtml(petData.name)}</span><span class="pet-happy">${petData.dead?'💤 需要食物':`♡ ${mood}`}</span>${petFurnitureIcons()}${stage}<div class="pet-speech" id="petSpeech">${escapeHtml(getPetMessage())}</div></div><div class="pet-meter-row"><span>🍗 飽食度</span><strong>${Math.round(petData.fullness)}%</strong></div><div class="pet-progress"><span class="hunger-fill" style="width:${petData.fullness}%;background:${petData.fullness<25?'#dc8c72':petData.fullness<50?'#e1b56d':'#88b89a'}"></span></div><div class="pet-progress-label"><span>${petData.dead?'寵物已虛弱，餵食可救回牠':`大約 ${Math.max(0,Math.ceil((petData.fullness/2)-12))} 小時後需要餵食`}</span><span>${petData.bond||0} 次互動</span></div><div class="pet-actions"><button id="talkPet">💬 跟牠說說話</button><button id="feedPet" ${petData.dead&&!visibleFoods.length?'disabled':''}>🍎 餵食</button></div><div class="room-controls"><button id="changeRoom">🎨 更換背景</button><label class="room-upload-button" for="roomPhotoInput">🖼️ 上傳背景</label><input id="roomPhotoInput" type="file" accept="image/*"></div><p class="room-hint">拖曳家具調整位置，點擊家具可收起。</p><button class="pet-edit" id="editPet">更換寵物或照片</button><div class="pet-shop"><div class="pet-shop-head"><span>寵物小舖</span><span style="color:#996c29">🪙 ${petData.coins}</span></div><div class="shop-tabs"><button class="shop-tab ${shopTab==='food'?'active':''}" data-tab="food">🍎 食物</button><button class="shop-tab ${shopTab==='furniture'?'active':''}" data-tab="furniture">🪑 家具</button></div><div class="shop-items">${SHOP.filter(x=>x.type===shopTab).map(item=>{const owned=petData.inventory.includes(item.id),placed=petData.furniture.includes(item.id);return `<div class="shop-item"><span>${item.icon}</span><div class="shop-item-info"><strong>${item.name}</strong><small>${item.type==='food'?'餵食 +35 飽食度':placed?'已放置':owned?'已收藏':`🪙 ${item.cost}`}</small></div><button data-${item.type==='food'?'feed':'place'}="${item.id}" ${item.type==='food'?(owned?'':'disabled'):((!owned&&!petData.inventory.includes(item.id))?'':'')}>${item.type==='food'?(owned?'餵食':'購買'):placed?'收起':owned?'放置':'購買'}</button></div>`}).join('')}</div><div class="pet-inventory">家具可在場景上放置、收起；食物購買後會加入食物庫。</div></div>`;root.querySelectorAll('.placed-furniture').forEach(el=>el.addEventListener('pointerdown',startFurnitureDrag));root.querySelector('#changeRoom')?.addEventListener('click',cycleBackground);root.querySelector('#roomPhotoInput')?.addEventListener('change',uploadBackground);root.querySelector('#editPet').addEventListener('click',()=>openPetSetup(true));root.querySelector('#talkPet').addEventListener('click',talkToPet);root.querySelector('#feedPet').addEventListener('click',feedPet);startPetWander();startPetWander();root.querySelectorAll('.shop-tab').forEach(btn=>btn.addEventListener('click',()=>{shopTab=btn.dataset.tab;renderPet()}));root.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>buyShopItem(btn.dataset.buy)));root.querySelectorAll('[data-feed]').forEach(btn=>btn.addEventListener('click',()=>feedPet(btn.dataset.feed)));root.querySelectorAll('[data-place]').forEach(btn=>btn.addEventListener('click',()=>placeFurniture(btn.dataset.place)));root.querySelectorAll('[data-remove-furniture]').forEach(btn=>btn.addEventListener('click',()=>removeFurniture(btn.dataset.removeFurniture)));root.querySelectorAll('.shop-item button:disabled').forEach(btn=>btn.title='需先購買並收藏此物品')}
function talkToPet(){if(!petData)return;petData.bond=(petData.bond||0)+1;savePet();const responses=petData.dead?[`${petData.name}沒有力氣說話了，先餵牠一份食物吧。`]:petData.fullness<25?['肚子好餓…可以餵我嗎？','我最喜歡你了，可是我需要吃點東西。']:['今天也辛苦了，來陪我一下吧！','謝謝你照顧我，我會陪著你。','摸摸我，我就充滿精神了！','我們一起完成今天的小目標吧！'];const msg=responses[Math.floor(Math.random()*responses.length)];const el=$('petSpeech');if(el){el.textContent=msg;el.classList.remove('speech-pop');void el.offsetWidth;el.classList.add('speech-pop')}petToast(msg);renderPet()}
function feedPet(id){if(!petData)return;let food=id?SHOP.find(x=>x.id===id&&x.type==='food'):null;if(food){if(!petData.inventory.includes(food.id)){petToast('請先購買食物');return}petData.inventory=petData.inventory.filter(x=>x!==food.id)}else{food=SHOP.find(x=>x.type==='food'&&petData.inventory.includes(x.id));if(!food){petToast('食物庫沒有食物，請先到小舖購買');shopTab='food';renderPet();return}petData.inventory=petData.inventory.filter(x=>x!==food.id)}petData.fullness=Math.min(100,(petData.fullness||0)+35);petData.lastFedAt=Date.now();petData.dead=false;petData.fed=(petData.fed||0)+1;savePet();renderPet();petToast(`${petData.name}吃得好滿足！飽食度 +35 🧡`)}
function placeFurniture(id){const item=SHOP.find(x=>x.id===id&&x.type==='furniture');if(!item||!petData)return;if(petData.furniture.includes(id)){removeFurniture(id);return}if(!petData.inventory.includes(id)){if(petData.coins<item.cost){petToast(`還差 ${item.cost-petData.coins} 枚代幣`);return}petData.coins-=item.cost;petData.inventory.push(id)}petData.furniture.push(id);savePet();renderPet();petToast(`${item.name}已放進寵物房間！點擊場景物件可收起。`)}
function removeFurniture(id){if(!petData)return;petData.furniture=(petData.furniture||[]).filter(x=>x!==id);savePet();renderPet();petToast('家具已收起，仍保留在收藏中。')}function startPetWander(){const room=$('petStage'),pet=room?.querySelector('.pet-walker');if(!room||!pet)return;const x=14+Math.random()*72,y=48+Math.random()*32;pet.style.setProperty('--pet-x',`${x}%`);pet.style.setProperty('--pet-y',`${y}%`);clearTimeout(startPetWander.timer);startPetWander.timer=setTimeout(startPetWander,2500+Math.random()*3000)}
function startFurnitureDrag(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();e.stopPropagation();const el=e.currentTarget,room=$('petStage');el.setPointerCapture?.(e.pointerId);const move=ev=>{const r=room.getBoundingClientRect(),x=Math.max(5,Math.min(95,(ev.clientX-r.left)/r.width*100)),y=Math.max(12,Math.min(88,(ev.clientY-r.top)/r.height*100));el.style.left=`${x}%`;el.style.top=`${y}%`;el.dataset.x=x;el.dataset.y=y};const end=()=>{const id=el.dataset.removeFurniture;petData.furniturePos=petData.furniturePos||{};petData.furniturePos[id]={x:Number(el.dataset.x),y:Number(el.dataset.y)};savePet();el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function cycleBackground(){const opts=['home','meadow','ocean','night','sunset'];const current=petData.background||'home';petData.background=opts[(opts.indexOf(current)+1)%opts.length];savePet();renderPet();petToast('背景已更換')}
function uploadBackground(e){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){petToast('請選擇圖片檔案');return}if(file.size>1_500_000){petToast('背景圖片請小於 1.5 MB');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{petData.customBackground=String(reader.result);petData.background='custom';savePet();renderPet();const room=$('petStage');if(room)room.style.backgroundImage='url('+petData.customBackground+')';petToast('已套用自訂背景')};reader.readAsDataURL(file)}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function buyShopItem(id){const item=SHOP.find(x=>x.id===id);if(!item||!petData)return;if(item.type==='food'){if(petData.inventory.includes(id)){petToast('這份食物已在食物庫中，可直接餵食。');feedPet(id);return}if(petData.coins<item.cost){petToast(`還差 ${item.cost-petData.coins} 枚代幣`);return}petData.coins-=item.cost;petData.inventory.push(id);savePet();renderPet();petToast(`${item.name}已放入食物庫，記得餵食！`);return}placeFurniture(id)}function openPetSetup(edit=false){selectedPet=petData?.kind||'cat';pendingPhoto=petData?.photo||'';$('petNameInput').value=petData?.name||'';$('petPhotoInput').value='';$('photoPreview').hidden=!pendingPhoto;$('photoPreview').innerHTML=pendingPhoto?`<img src="${pendingPhoto}" alt="照片預覽">`:'';document.querySelectorAll('.pet-choice').forEach(btn=>btn.classList.toggle('active',btn.dataset.pet===selectedPet));$('petSetupTitle').textContent=edit?'更新寵物資料':'認識你的新夥伴';$('petSetupOverlay').classList.add('open')}
function closePetSetup(){$('petSetupOverlay').classList.remove('open')}
document.querySelectorAll('.pet-choice').forEach(btn=>btn.addEventListener('click',()=>{selectedPet=btn.dataset.pet;pendingPhoto='';$('photoPreview').hidden=true;document.querySelectorAll('.pet-choice').forEach(x=>x.classList.toggle('active',x===btn))}));$('petPhotoInput').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){petToast('請選擇圖片檔案');return}if(file.size>1_500_000){petToast('照片請小於 1.5 MB，方便保存在瀏覽器');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{pendingPhoto=String(reader.result);$('photoPreview').innerHTML=`<img src="${pendingPhoto}" alt="照片預覽">`;$('photoPreview').hidden=false};reader.readAsDataURL(file)});$('petSetupForm').addEventListener('submit',e=>{e.preventDefault();const old=petData;petData={name:$('petNameInput').value.trim()||'豆豆',kind:selectedPet,photo:pendingPhoto,coins:old?.coins||0,inventory:old?.inventory||[],fed:old?.fed||0};savePet();closePetSetup();renderPet();petToast(`歡迎回家，${petData.name}！`)});$('closePetSetup').addEventListener('click',closePetSetup);$('cancelPetSetup').addEventListener('click',closePetSetup);$('petSetupOverlay').addEventListener('click',e=>{if(e.target===$('petSetupOverlay'))closePetSetup()});
function render(){renderCalendar();renderDay();renderCompleted();renderPet()}
function toggleDone(id){const e=entries.find(x=>x.id===id);if(!e)return;e.done=!e.done;if(e.done&&e.type==='task'&&!e.rewarded){ensurePet();if(petData){petData.coins+=5;e.rewarded=true;savePet()}}save();render();if(e.done&&e.type==='task'){const root=petRoot;if(root){const el=root.querySelector('#petSpeech');if(el)el.textContent='任務完成了！你真棒，我也替你開心！🪙'}}toast(e.done?(e.type==='task'?'任務完成！獲得 5 枚代幣':'已標示完成'):'已移回待完成')}
function openModal(entry){$('entryForm').reset();$('entryId').value=entry?.id||'';$('modalTitle').textContent=entry?'編輯安排':'新增安排';$('entryTitle').value=entry?.title||'';$('entryType').value=entry?.type||'task';$('entryDate').value=entry?.date||selectedDate;$('startTime').value=entry?.start||'';$('endTime').value=entry?.end||'';$('entryNote').value=entry?.note||'';$('deleteBtn').hidden=!entry;$('overlay').classList.add('open');setTimeout(()=>$('entryTitle').focus(),50)}
function closeModal(){$('overlay').classList.remove('open')}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const id=$('entryId').value,title=$('entryTitle').value.trim(),date=$('entryDate').value,start=$('startTime').value,end=$('endTime').value;if(end&&start&&end<start){toast('結束時間需晚於開始時間');return}const value={id:id||`e-${Date.now()}`,title,type:$('entryType').value,date,start,end,note:$('entryNote').value.trim(),done:false};if(id){const old=entries.find(x=>x.id===id);value.done=old?.done||false;entries=entries.map(x=>x.id===id?value:x)}else entries.push(value);save();selectedDate=date;const d=new Date(date+'T12:00:00');viewMonth=new Date(d.getFullYear(),d.getMonth(),1);closeModal();render();toast(id?'已更新安排':'已新增安排')});
$('deleteBtn').addEventListener('click',()=>{const id=$('entryId').value;if(!id)return;entries=entries.filter(x=>x.id!==id);save();closeModal();render();toast('已刪除安排')});
$('addBtn').addEventListener('click',()=>openModal());$('closeModal').addEventListener('click',closeModal);$('cancelModal').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('completedToggle').addEventListener('click',()=>{showCompleted=!showCompleted;renderCompleted()});$('prevBtn').addEventListener('click',()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCalendar()});$('nextBtn').addEventListener('click',()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCalendar()});$('todayBtn').addEventListener('click',()=>{viewMonth=new Date(today.getFullYear(),today.getMonth(),1);selectedDate=iso(today);render()});$('weekJump').addEventListener('click',()=>{showCompleted=true;renderCompleted();$('completedWrap').scrollIntoView({behavior:'smooth',block:'nearest'})});
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
$('topToday').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric'}).format(today);render();
})();
</script>
